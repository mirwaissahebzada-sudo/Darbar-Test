<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><link rel="manifest" href="manifest.webmanifest"><title>مدیریت کارگاه لیزری دربار</title><style>

isplay:block;font-size:13px}.quick small{display:block;color:var(--muted);font-size:10px}.quick.out .qicon{background:#fff0ed;color:var(--red)}.btn{background:var(--navy);color:white;border:0;border-radius:11px;padding:9px 12px;font-weight:bold;font:inherit;cursor:pointer}.btn.light{background:#edf2f7;color:var(--ink)}.btn.redbtn{background:#fff0f0;color:var(--red);border:1px solid #ffdada}.btn.sm{font-size:11px;padding:5px 8px}.actions{display:flex;gap:6px;flex-wrap:wrap}.search,.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d7e0e9;border-radius:10px;background:white;color:var(--ink);font:inherit}.search{margin-bottom:11px}.field{margin-bottom:11px}.field label{display:block;font-weight:bold;font-size:12px;margin-bottom:4px}.field textarea{min-height:70px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}.span2{grid-column:1/-1}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;min-width:520px;border-collapse:collapse;background:white}th,td{text-align:right;padding:9px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}th{background:#f5f8fb;color:#50657a}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.small{font-size:11px}.pill{display:inline-block;background:#edf2f7;border-radius:15px;padding:2px 7px;font-size:10px}.notice{background:#fff7e5;border:1px solid #f2dfad;color:#745516;border-radius:12px;padding:10px;font-size:11px;margin:10px 0}.empty{text-align:center;color:var(--muted);padding:20px}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:7px 7px calc(7px + env(safe-area-inset-bottom));z-index:5}.navinner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;background:transparent;color:#718096;border-radius:10px;padding:6px 1px;font:10px Tahoma;display:flex;align-items:center;flex-direction:column;gap:1px}.nav b{font-size:18px}.nav .active{background:#eaf2f8;color:var(--navy);font-weight:bold}.modalbg{position:fixed;inset:0;background:#0b1f33a6;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{background:white;width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:20px;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalhead h3{margin:0;font-size:17px}.close{border:0;background:#edf2f7;border-radius:10px;width:34px;height:34px;font-size:20px}.hidden{display:none!important}.toast{position:fixed;z-index:30;bottom:85px;right:50%;transform:translateX(50%);background:var(--navy);color:white;border-radius:12px;padding:10px 15px;max-width:90%;font-size:12px}.printhead,.printfoot{display:none}.login{min-height:100dvh;display:grid;place-items:center;padding:20px}.loginbox{background:white;padding:24px;border-radius:20px;max-width:400px;width:100%}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}.quickgrid{grid-template-columns:repeat(4,1fr)}.content{padding:20px}.modalbg{align-items:center}}@media(max-width:360px){.content{padding:10px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}}
@media print{body{background:white;font-size:10px}.top,.nav,.noprint,.btn,.actions{display:none!important}.app{max-width:none;padding:0}.content{padding:0}.panel,.card{box-shadow:none;border:0}.tablewrap{overflow:visible}table{min-width:0}th,td{font-size:9px;padding:5px}.printhead,.printfoot{display:block}.grid{grid-template-columns:repeat(4,1fr)}}

</style></head><body><div id="root"></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),root=$('#root'),KEY='darbar_workshop_v2',SESSION='darbar_login_v2';const defaults={shopName:'مدیریت کارگاه لیزری دربار',phone:'',address:'',currency:'افغانی',logo:'',pinEnabled:false,pin:'',next:{CUS:1,ORD:1,TRX:1,EXP:1,EMP:1,MAT:1}};let db,page='home',q='',modal=null,start='',end='';
const blank=()=>({version:2,settings:{...defaults,next:{...defaults.next}},customers:[],orders:[],transactions:[],expenses:[],employees:[],inventory:[],stockMoves:[],production:[],employeePayments:[]});
function load(){try{db=JSON.parse(localStorage.getItem(KEY));if(!db||db.version!==2)db=blank();db.settings={...defaults,...db.settings,next:{...defaults.next,...db.settings?.next}};['customers','orders','transactions','expenses','employees','inventory','stockMoves','production','employeePayments'].forEach(k=>db[k] ||= [])}catch(e){db=blank()}save();applyTheme()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('ذخیره‌سازی ناکام شد؛ از معلومات پشتیبان بگیرید.')}}
function dig(s){return String(s??'').replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c))}
function faNum(x){return String(x??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)]).replace(/\./g,'٫')}function n(x){let v=Number(dig(String(x??'').replace(/٫/g,'.').replace(/[,\s٬]/g,'')));return Number.isFinite(v)?v:0}function money(x){return faNum(n(x).toLocaleString('en-US',{maximumFractionDigits:2}))+' '+db.settings.currency}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(t){let x=db.settings.next[t]||1;db.settings.next[t]=x+1;let p={CUS:'م',ORD:'س',TRX:'د',EXP:'م‌ص',EMP:'ک',MAT:'ج'}[t]||t;return p+faNum(x)}
function iso(){return new Date().toISOString().slice(0,10)}
function faDate(d){if(!d)return'—';try{return new Intl.DateTimeFormat('fa-AF-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d+'T12:00:00'))}catch(e){return d}}
function jalaliInput(d){return d?faDate(d).replace(/\s/g,''):''}
function jalaliToISO(v){v=dig(String(v||'')).replace(/[٫]/g,'.').trim();if(!v)return iso();let m=v.match(/^(\d{3,4})[\/.-](\d{1,2})[\/.-](\d{1,2})$/);if(!m)return v;let jy=+m[1],jm=+m[2],jd=+m[3];if(jm<1||jm>12||jd<1||jd>31)return v;let fmt=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'});let start=new Date(Date.UTC(jy+621,2,15,12));for(let i=0;i<30;i++){let d=new Date(start.getTime()+i*86400000),a=Object.fromEntries(fmt.formatToParts(d).filter(x=>x.type!=='literal').map(x=>[x.type,+x.value]));if(a.year===jy&&a.month===1&&a.day===1){let out=new Date(d.getTime()+((jm-1)*30+(jm<=6?jd-1:jd+5))*86400000);return out.toISOString().slice(0,10)}}return v}
function today(){return faDate(iso())}
function applyTheme(){document.body.classList.remove('theme-dark','theme-white');if(db.settings.theme==='dark')document.body.classList.add('theme-dark');if(db.settings.theme==='white')document.body.classList.add('theme-white');document.body.style.fontFamily=db.settings.font||'Tahoma,Arial,sans-serif'}
function toast(s){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.append(t)}t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
function logged(){return sessionStorage.getItem(SESSION)==='ok'}
function login(){root.innerHTML=`<div class="login"><div class="loginbox"><div class="symbol">د</div><h2>${esc(db.settings.shopName)}</h2><p class="muted">رمز ورود را وارد کنید.</p><form id="login"><div class="field"><label>رمز</label><input name="pin" type="password" required inputmode="numeric"></div><button class="btn">ورود</button></form></div></div>`;$('#login').onsubmit=e=>{e.preventDefault();if(dig(new FormData(e.target).get('pin'))===db.settings.pin){sessionStorage.setItem(SESSION,'ok');render()}else toast('رمز نادرست است')}}
const navs=[['home','⌂','خانه'],['orders','▤','سفارشات'],['customers','♙','مشتریان'],['transactions','⇄','عواید/پرداخت'],['more','☰','بخش‌ها']];
function header(){return `<header class="top"><div class="toprow"><div class="brand"><div class="logo">${db.settings.logo?`<img src="${db.settings.logo}" style="width:100%;height:100%;object-fit:contain">`:'د'}</div><div><h1>${esc(db.settings.shopName)}</h1><p>سامانهٔ مدیریت حساب‌ها و سفارشات</p></div></div><div><button data-action="settings">⚙</button> <button data-action="lock">⌑</button></div></div><div class="today">امروز: ${today()}　 ${esc(db.settings.phone)}</div></header>`}
function nav(){return `<nav class="nav noprint"><div class="navinner">${navs.map(([p,i,t])=>`<button data-go="${p}" class="${page===p||(['expenses','reports','settings','employees','inventory'].includes(page)&&p==='more')?'active':''}"><b>${i}</b>${t}</button>`).join('')}</div></nav>`}
function metric(a,b,c,color=''){return `<div class="card metric"><div class="symbol">${c}</div><div><div class="label">${a}</div><div class="value ${color}">${b}</div></div></div>`}
function home(){let inc=sum(db.transactions.filter(t=>t.type==='in'),'amount'),out=sum(db.transactions.filter(t=>t.type==='out'),'amount')+sum(db.expenses,'amount'),due=sum(db.orders,'total')-sum(db.orders,'paid');return `<div class="head"><h2>خلاصهٔ کارگاه</h2><span class="pill">موبایل</span></div><div class="grid">${metric('دریافت‌های ثبت‌شده',money(inc),'↙','green')}${metric('پرداخت و مصارف',money(out),'↗','red')}${metric('باقی‌داری سفارش‌ها',money(Math.max(0,due)),'◷')}${metric('تعداد مشتریان',faNum(db.customers.length),'♙')}</div><div class="head" style="margin-top:22px"><h2>ثبت سریع</h2><span class="muted small">با یک لمس</span></div><div class="quickgrid"><button class="quick" data-modal="txn-in"><div class="qicon">＋</div><div><strong>پول آمده</strong><small>ثبت دریافت</small></div></button><button class="quick out" data-modal="txn-out"><div class="qicon">－</div><div><strong>پول داده‌شده</strong><small>ثبت پرداخت</small></div></button><button class="quick" data-modal="order"><div class="qicon">▤</div><div><strong>سفارش جدید</strong><small>ثبت فرمایش</small></div></button><button class="quick" data-modal="expense"><div class="qicon">◈</div><div><strong>مصرف روزمره</strong><small>ثبت مصارف</small></div></button></div><div class="head" style="margin-top:22px"><h2>آخرین سفارش‌ها</h2><button class="btn light" data-go="orders">همه</button></div><div class="panel">${table(db.orders.slice(0,5).map(o=>[o.code,faDate(o.date),o.customerName||o.guestName||'',o.service,money(o.total)]),['شناسه','تاریخ','مشتری','خدمت','مبلغ'])}</div><div class="notice">معلومات در همین مرورگر و دستگاه ذخیره می‌شود. مرتب از تنظیمات نسخهٔ پشتیبان بگیرید.</div>`}
function sum(a,k){return a.reduce((s,x)=>s+n(x[k]),0)}
function table(rows,heads){if(!rows.length)return '<div class="empty">معلوماتی ثبت نشده است.</div>';return `<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function customerOpts(sel=''){return `<option value="">— انتخاب مشتری (اختیاری) —</option>`+db.customers.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)} · ${c.code}</option>`).join('')}
function orderOpts(sel=''){return `<option value="">— بدون ارتباط با سفارش —</option>`+db.orders.map(o=>`<option value="${o.id}" ${sel===o.id?'selected':''}>${o.code} — ${esc(o.customerName||o.guestName||'مشتری')}</option>`).join('')}
function listPage(type){let conf={
customers:['مشتریان','مشتری','name',['شناسه','نام','شماره','عملیات']],
orders:['سفارشات','سفارش','service',['شناسه','مشتری','خدمت','مبلغ','باقی','هزینه مواد','حاشیه پس از مواد / عملیات']],
transactions:['عواید و پرداخت‌ها','txn','amount',['شناسه','تاریخ','نوع','شخص','سفارش','مبلغ','عملیات']],
expenses:['مصارف روزمره','مصرف','amount',['شناسه','تاریخ','نوع مصرف','شرح','مبلغ','عملیات']],
employees:['کارمندان','کارمند','name',['شناسه','نام','معاش','شماره','عملیات']],
inventory:['موجودی انبار','قلم','name',['شناسه','نام مواد','موجود','واحد','مصرف‌شده','قیمت واحد','عملیات']]
}[type];let arr=db[type].filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));let rows=arr.map(x=>{let act=`<div class="actions"><button class="btn light sm" data-edit="${type}:${x.id}">ویرایش</button><button class="btn redbtn sm" data-del="${type}:${x.id}">حذف</button></div>`;if(type==='customers')return [x.code,esc(x.name),esc(x.phone||'—'),`<button class="btn light sm" data-detail="${x.id}">حساب</button> ${act}`];if(type==='orders'){let mc=sum(db.production.filter(z=>z.orderId===x.id),'cost');return [x.code,esc(x.customerName||x.guestName||'—'),esc(x.service),money(x.total),money(Math.max(0,n(x.total)-n(x.paid))),money(mc),`<span class=\"${n(x.total)-mc>=0?'profit-good':'profit-bad'}\">${money(n(x.total)-mc)}</span> ${act}`]};if(type==='transactions')return [x.code,faDate(x.date),x.type==='in'?'دریافت':'پرداخت',esc(x.personName||'—'),esc(x.orderCode||'—'),money(x.amount),act];if(type==='expenses')return [x.code,faDate(x.date),esc(x.category),esc(x.note||'—'),money(x.amount),act];if(type==='employees')return [x.code,esc(x.name),money(x.salary),esc(x.phone||'—'),`<button class=\"btn light sm\" data-empay=\"${x.id}\">پرداخت / برداشت</button> ${act}`];let used=sum(db.production.filter(z=>z.materialId===x.id),'qty');return [x.code,esc(x.name),faNum(x.qty),esc(x.unit||'عدد'),faNum(used),money(x.unitCost||0),`<div class=\"actions\"><button class=\"btn light sm\" data-stockin=\"${x.id}\">ورود خرید</button><button class=\"btn light sm\" data-consume=\"${x.id}\">مصرف</button></div>${act}`]});return `<div class="head"><h2>${conf[0]}</h2><button class="btn" data-modal="${conf[1]}">＋ افزودن</button></div><input class="search" id="search" placeholder="جستجو…" value="${esc(q)}"><div class="panel">${table(rows,conf[3])}</div>${type==='employees'?`<div class="panel"><h3>جدول پرداخت، برداشت و بدهی کارمندان</h3>${table(db.employeePayments.map(z=>{let e=db.employees.find(y=>y.id===z.employeeId);return [faDate(z.date),esc(e?.name||'کارمند حذف‌شده'),z.type==='salary'?'معاش':z.type==='advance'?'پیش‌پرداخت / برداشت':'بدهی',money(z.amount),esc(z.note||'')] }),['تاریخ','کارمند','نوع','مبلغ','یادداشت'])}</div>`:type==='inventory'?`<div class="panel"><h3>تاریخچهٔ ورود و مصرف مواد</h3><p class="small muted">خریدهای نسیهٔ ثبت‌شده: ${money(db.stockMoves.filter(z=>z.type==='in'&&z.payment==='credit').reduce((a,z)=>a+n(z.totalCost),0))} (پرداختنی به فروشنده؛ تسویهٔ آن باید جداگانه ثبت شود).</p>${table(db.stockMoves.map(z=>{let m=db.inventory.find(y=>y.id===z.materialId),o=db.orders.find(y=>y.id===z.orderId);return [faDate(z.date),esc(m?.name||'ماده'),z.type==='in'?'ورود خرید':'مصرف',faNum(z.qty),money(z.totalCost),esc(o?.code||'—'),esc(z.note||'')] }),['تاریخ','ماده','حرکت','مقدار','هزینه','سفارش','شرح'])}</div>`:''}` }
function more(){return `<div class="head"><h2>بخش‌های کارگاه</h2></div><div class="quickgrid">${[['expenses','◈','مصارف روزمره','برق، مواد و کرایه'],['employees','♙','کارمندان','معاش و معلومات'],['inventory','▦','موجودی انبار','مواد و تعداد'],['reports','▥','گزارش‌ها','بازهٔ تاریخ و چاپ'],['settings','⚙','تنظیمات','نام، لوگو، پشتیبان'],['help','؟','راهنما','آموزش استفاده']].map(x=>`<button class="quick" data-go="${x[0]}"><div class="qicon">${x[1]}</div><div><strong>${x[2]}</strong><small>${x[3]}</small></div></button>`).join('')}</div>`}

function reports(){let a=start||iso().slice(0,8)+'01',b=end||iso(),tx=db.transactions.filter(x=>x.date>=a&&x.date<=b),ex=db.expenses.filter(x=>x.date>=a&&x.date<=b),od=db.orders.filter(x=>x.date>=a&&x.date<=b);return `<div class="head"><h2>گزارش‌ها</h2><button class="btn" data-action="print">چاپ / PDF</button></div><div class="panel"><form id="reportform"><div class="formgrid"><div class="field"><label>از تاریخ</label><input type="text" name="start" placeholder="۱۴۰۵/۰۸/۰۱" value="${jalaliInput(a)}"></div><div class="field"><label>تا تاریخ</label><input type="text" name="end" placeholder="۱۴۰۵/۰۸/۳۰" value="${jalaliInput(b)}"></div></div><button class="btn">نمایش گزارش</button></form></div><div class="printhead"><h2>${esc(db.settings.shopName)} — گزارش مالی</h2><p>از ${faDate(a)} تا ${faDate(b)}</p></div><div class="grid">${metric('دریافت',money(sum(tx.filter(x=>x.type==='in'),'amount')),'↙','green')}${metric('پرداخت',money(sum(tx.filter(x=>x.type==='out'),'amount')),'↗','red')}${metric('مصارف',money(sum(ex,'amount')),'◈','red')}${metric('ارزش سفارش‌ها',money(sum(od,'total')),'▤')}</div><div class="panel"><h3>معاملات</h3>${table(tx.map(x=>[faDate(x.date),x.type==='in'?'دریافت':'پرداخت',esc(x.personName||''),esc(x.note||x.orderCode||''),money(x.amount)]),['تاریخ','نوع','شخص','شرح','مبلغ'])}</div><div class="panel"><h3>مصارف</h3>${table(ex.map(x=>[faDate(x.date),esc(x.category),esc(x.note||''),money(x.amount)]),['تاریخ','نوع','شرح','مبلغ'])}</div><div class="panel"><h3>سفارش‌ها و هزینهٔ مواد</h3>${table(od.map(x=>{let mc=sum(db.production.filter(z=>z.orderId===x.id),'cost');return [faDate(x.date),x.code,esc(x.customerName||x.guestName||''),esc(x.service),money(x.total),money(mc),money(n(x.total)-mc),money(Math.max(0,n(x.total)-n(x.paid)))]}),['تاریخ','شناسه','مشتری','خدمت','قیمت نهایی','هزینه مواد','حاشیه پس از مواد','باقی'])}<p class="small muted">حاشیهٔ نمایش‌داده‌شده فقط پس از کسر مواد ثبت‌شده است؛ معاش، کرایه، برق و سایر هزینه‌های عمومی در آن تخصیص نیافته‌اند و سود خالص قطعی نیست.</p></div><div class="printfoot">تهیه‌شده از ${esc(db.settings.shopName)} — ${today()}</div>`}
function help(){return `<div class="head"><h2>راهنمای برنامه</h2></div><div class="panel"><h3>مشتریان</h3><p>مشتری تکراری را یک‌بار ثبت کنید؛ در سفارش و دریافت پول از فهرست انتخاب نمایید. مشتری یک‌باره را در «نام موقت» وارد کنید.</p><h3>سفارشات</h3><p>مبلغ کل، تاریخ، خدمت و مشتری را وارد کنید. پیش‌پرداخت واردشده در سفارش برای محاسبهٔ باقی‌داری است؛ برای سابقهٔ دقیق دریافت، معاملهٔ «پول آمده» نیز ثبت کنید، اما یک مبلغ را دو بار در گزارش نقدی ثبت نکنید.</p><h3>پرداخت شخص ثالث</h3><p>برای سفارش بدون مصرف انبار، از ثبت «پول داده‌شده» استفاده کنید و شخص ثالث را از مشتریان موجود انتخاب نمایید؛ در صورت نیاز نام موقت نیز ثبت می‌شود.</p><h3>عواید / پرداخت‌ها</h3><p>در ثبت پول آمده یا داده‌شده، مشتری و سفارش مربوط را انتخاب کنید تا سابقه به حساب صحیح وصل شود.</p><h3>پشتیبان</h3><p>در تنظیمات فایل JSON بگیرید و آن را در جای امن نگه دارید. بازیابی پشتیبان، معلومات فعلی را جایگزین می‌کند.</p><h3>PDF و Excel</h3><p>گزارش‌ها را باز کرده و چاپ / PDF را بزنید. CSV با UTF-8 برای بازکردن در Excel صادر می‌شود. خروجی چاپ مرورگر را قبل از استفاده رسمی آزمایش کنید.</p><div class="notice">داده‌ها فقط روی همین دستگاه/مرورگر است و خودکار همگام نمی‌شود. پاک‌کردن داده‌های مرورگر ممکن است معلومات را از بین ببرد.</div></div>`}
function render(){if(db.settings.pinEnabled&&!logged()){login();return}let body=({home,customers:()=>listPage('customers'),orders:()=>listPage('orders'),transactions:()=>listPage('transactions'),expenses:()=>listPage('expenses'),employees:()=>listPage('employees'),inventory:()=>listPage('inventory'),more,settings,reports,help}[page]||home)();root.innerHTML=`<div class="app">${header()}<main class="content">${body}<p class="muted small" style="text-align:center">اطلاعات در همین دستگاه ذخیره می‌شود؛ مرتب نسخهٔ پشتیبان بگیرید.</p></main>${nav()}</div>`;bind();if(modal)showModal(modal)}

function showModal(k,id0=''){modal=k;$('#modalbg')?.remove();document.body.insertAdjacentHTML('beforeend',modalHtml(k,id0));let f=$('#rec');if(f)f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f).entries()),kind=f.dataset.kind,oldid=f.dataset.id;
